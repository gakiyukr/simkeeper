{{define "page_admin_settings"}}{{template "head" .}}
<div class="page-head">
  <div>
    <h1 class="page-title">系统设置</h1>
    <p class="page-desc">站点全局参数，保存后立即生效</p>
  </div>
</div>

<div class="card" style="max-width:40rem">
  <div class="card-content">
    <form method="post" action="/admin/settings">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <div class="form-grid">
        <div class="field span2">
          <label class="label" for="st-name">站点名称</label>
          <input class="input" type="text" id="st-name" name="site_name" value="{{.Content.SiteName}}" required>
        </div>
        <div class="field">
          <label class="label" for="st-max">每用户号码上限</label>
          <input class="input" type="number" min="1" max="10000" id="st-max" name="max_numbers_per_user" value="{{.Content.MaxNumbers}}">
        </div>
        <div class="field">
          <label class="label" for="st-ret">通知记录保留天数</label>
          <input class="input" type="number" min="1" max="3650" id="st-ret" name="log_retention_days" value="{{.Content.RetentionDays}}">
        </div>
        <div class="field span2">
          <label class="checkline" for="allow_registration">
            <input type="checkbox" id="allow_registration" name="allow_registration" value="1"
                   {{if .Content.AllowReg}}checked{{end}}>
            <span>允许新用户注册<small class="hint" style="display:block">关闭后登录页隐藏注册入口，服务端同时拒绝注册请求</small></span>
          </label>
        </div>
      </div>
      <button type="submit" class="btn" style="margin-top:1.4rem">保存设置</button>
    </form>
  </div>
</div>
{{template "foot" .}}{{end}}

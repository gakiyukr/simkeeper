{{define "page_admin_settings"}}{{template "head" .}}
<div class="card" style="max-width:640px">
  <div class="card-h">系统设置</div>
  <div class="card-b">
    <form method="post" action="/admin/settings">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <div class="field">
        <label>站点名称</label>
        <input type="text" name="site_name" value="{{.Content.SiteName}}" required>
      </div>
      <div class="row2">
        <div class="field">
          <label>每用户号码上限</label>
          <input type="number" min="1" max="10000" name="max_numbers_per_user" value="{{.Content.MaxNumbers}}">
        </div>
        <div class="field">
          <label>通知记录保留天数</label>
          <input type="number" min="1" max="3650" name="log_retention_days" value="{{.Content.RetentionDays}}">
        </div>
      </div>
      <div class="field check">
        <input type="checkbox" id="allow_registration" name="allow_registration" value="1"
               {{if .Content.AllowReg}}checked{{end}}>
        <label for="allow_registration" style="margin:0">
          允许新用户注册（关闭后登录页隐藏注册入口，服务端同时拒绝注册请求）
        </label>
      </div>
      <button type="submit" class="btn">保存设置</button>
    </form>
  </div>
</div>
{{template "foot" .}}{{end}}

{{define "page_login"}}{{template "authhead" .}}
<div class="tabs">
  <input type="radio" name="authtab" id="tab-login" checked>
  <div class="tab-panels">
    <section class="tab-panel p-login">
      <div class="card">
        <div class="card-header">
          <h1 class="card-title">欢迎回来</h1>
          <p class="card-desc">输入用户名和密码登录账号</p>
        </div>
        <div class="card-content">
          <form method="post" action="/login">
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
            <div class="field" style="margin-bottom:1rem">
              <label class="label" for="f-username">用户名</label>
              <input class="input" type="text" id="f-username" name="username" required autofocus autocomplete="username">
            </div>
            <div class="field" style="margin-bottom:1.25rem">
              <label class="label" for="f-password">密码</label>
              <input class="input" type="password" id="f-password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn" style="width:100%">登录</button>
          </form>
        </div>
      </div>
      <p class="auth-foot"><a href="/forgot">忘记密码？</a></p>
    </section>

  </div>
</div>
{{template "authfoot" .}}{{end}}

{{define "page_login"}}{{template "authhead" .}}
<!-- Flowbite 試點頁：內部元素用 Tailwind utilities + data-attribute 交互；
     authhead 骨架（auth-card 容器）暫留，全站遷移時一併更換。 -->
<section class="w-full">
  <div class="mb-5">
    <h1 class="text-2xl font-semibold text-gray-900 dark:text-white">欢迎回来</h1>
    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">输入用户名和密码登录账号</p>
  </div>
  <form method="post" action="/login"
        class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-700 dark:bg-gray-800">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div class="mb-4">
      <label for="f-username" class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">用户名</label>
      <input type="text" id="f-username" name="username" required autofocus autocomplete="username"
             class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-blue-500 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 dark:focus:border-blue-500 dark:focus:ring-blue-500"
             placeholder="用户名">
    </div>
    <div class="mb-6">
      <label for="f-password" class="mb-2 block text-sm font-medium text-gray-900 dark:text-white">密码</label>
      <input type="password" id="f-password" name="password" required autocomplete="current-password"
             class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 text-sm text-gray-900 focus:border-blue-500 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 dark:focus:border-blue-500 dark:focus:ring-blue-500"
             placeholder="••••••••">
    </div>
    <button type="submit"
            class="w-full rounded-lg bg-blue-700 px-5 py-2.5 text-sm font-medium text-white transition-colors hover:bg-blue-800 focus:outline-none focus:ring-4 focus:ring-blue-300 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
      登录
    </button>
  </form>
  <p class="mt-4 text-center text-sm">
    <a href="/forgot" class="font-medium text-blue-600 hover:underline dark:text-blue-500">忘记密码？</a>
  </p>
</section>
{{template "authfoot" .}}{{end}}

{{define "page_forgot"}}{{template "authhead" .}}
<div class="card auth-wide">
  <div class="card-header">
    <h1 class="card-title">找回密码</h1>
    <p class="card-desc">输入账号邮箱，重置链接将通过站点配置的邮件渠道发送（1 小时内有效，仅可使用一次）。</p>
  </div>
  <div class="card-content">
    <form method="post" action="/forgot">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <div class="field" style="margin-bottom:1.25rem">
        <label class="label" for="fg-email">账号邮箱</label>
        <input class="input" type="email" id="fg-email" name="email" required autofocus>
      </div>
      <button type="submit" class="btn" style="width:100%">发送重置邮件</button>
    </form>
  </div>
</div>
<p class="auth-foot"><a href="/login">返回登录</a></p>
{{template "authfoot" .}}{{end}}

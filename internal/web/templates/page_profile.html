{{define "page_profile"}}{{template "head" .}}
<div class="card" style="max-width:560px">
  <div class="card-h">账号信息</div>
  <div class="card-b">
    <p><span class="muted">用户名：</span>{{.User.Username}}</p>
    <p><span class="muted">当前邮箱：</span>{{.Content.Email}}</p>
  </div>
</div>

<div class="card" style="max-width:560px">
  <div class="card-h">修改邮箱</div>
  <div class="card-b">
    <form method="post" action="/profile">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <input type="hidden" name="change_email" value="1">
      <div class="field">
        <label>新邮箱</label>
        <input type="email" name="email" value="{{.Content.Email}}" required>
      </div>
      <button type="submit" class="btn">保存邮箱</button>
    </form>
  </div>
</div>

<div class="card" style="max-width:560px">
  <div class="card-h">修改密码</div>
  <div class="card-b">
    <p class="muted">修改成功后所有设备将被强制退出，需重新登录。</p>
    <form method="post" action="/profile">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <input type="hidden" name="change_password" value="1">
      <div class="field">
        <label>当前密码</label>
        <input type="password" name="current_password" required>
      </div>
      <div class="field">
        <label>新密码（至少 8 位）</label>
        <input type="password" name="new_password" required>
      </div>
      <div class="field">
        <label>确认新密码</label>
        <input type="password" name="confirm_password" required>
      </div>
      <button type="submit" class="btn">更新密码</button>
    </form>
  </div>
</div>
{{template "foot" .}}{{end}}

{{define "page_reset"}}{{template "head" .}}
<div class="card" style="max-width:460px;margin:2rem auto">
  <div class="card-h">设置新密码</div>
  <div class="card-b">
    <form method="post" action="/reset">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <input type="hidden" name="token" value="{{.Content.Token}}">
      <div class="field">
        <label>新密码（至少 8 位）</label>
        <input type="password" name="new_password" required autofocus>
      </div>
      <div class="field">
        <label>确认新密码</label>
        <input type="password" name="confirm_password" required>
      </div>
      <button type="submit" class="btn" style="width:100%">重置密码</button>
    </form>
  </div>
</div>
{{template "foot" .}}{{end}}

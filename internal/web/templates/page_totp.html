{{define "page_totp"}}{{template "head" .}}
<div class="card" style="max-width:420px;margin:2rem auto">
  <div class="card-h">两步验证</div>
  <div class="card-b">
    <p class="muted">请输入验证器应用中的 6 位验证码。</p>
    <form method="post" action="/login/totp">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <div class="field">
        <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code"
               pattern="[0-9]{6}" maxlength="6" required autofocus
               style="text-align:center;font-size:1.4rem;letter-spacing:.4em">
      </div>
      <button type="submit" class="btn" style="width:100%">验证并登录</button>
    </form>
  </div>
</div>
{{template "foot" .}}{{end}}
